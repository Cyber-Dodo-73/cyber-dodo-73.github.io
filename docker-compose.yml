# Exemple de déploiement sur le VPS derrière Traefik (réseau et resolver à adapter).
services:
  site:
    build: .
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.cyberdodo.rule=Host(`cyber-dodo.fr`) || Host(`www.cyber-dodo.fr`)
      - traefik.http.routers.cyberdodo.entrypoints=websecure
      - traefik.http.routers.cyberdodo.tls=true
      - traefik.http.services.cyberdodo.loadbalancer.server.port=80
    networks: [traefik]
networks:
  traefik:
    external: true
